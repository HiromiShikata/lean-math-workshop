<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Set X (outermost) -->
  <circle cx="200" cy="150" r="140" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="50" font-size="24" text-anchor="middle" font-weight="bold">X</text>
  
  <!-- Set B (middle) -->
  <circle cx="200" cy="150" r="100" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="90" font-size="24" text-anchor="middle" font-weight="bold">B</text>
  
  <!-- Set A (innermost) -->
  <circle cx="200" cy="150" r="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="200" y="130" font-size="24" text-anchor="middle" font-weight="bold">A</text>
  
  <!-- Elements in set A -->
  <text x="180" y="160" font-size="16" text-anchor="middle">φ</text>
  <text x="220" y="160" font-size="16" text-anchor="middle">ψ</text>
  
  <!-- Additional elements in set B (outside A) -->
  <text x="160" y="220" font-size="16" text-anchor="middle">φ∧ψ</text>
  <text x="240" y="220" font-size="16" text-anchor="middle">φ∧φ∧ψ</text>
  
  <!-- Additional element in set X (outside B) -->
  <text x="320" y="150" font-size="16" text-anchor="middle">⊥</text>
</svg>